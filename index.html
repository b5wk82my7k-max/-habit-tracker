<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />

  <title>Habit Tracker</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div id="app">

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

      <button
        id="prev-month"
        class="month-nav"
        type="button"
      >
        ‹
      </button>

      <h1 id="month-title">
        September 2026
      </h1>

      <button
        id="next-month"
        class="month-nav"
        type="button"
      >
        ›
      </button>

      <!-- STATISTICS -->
      <button
        id="stats-button"
        type="button"
        aria-label="Statistics"
        title="Statistics"
        style="
          background:white;
          border:1px solid #D1D1D6;
          width:44px;
          height:44px;
          min-width:44px;
          border-radius:50%;
          font-size:21px;
          cursor:pointer;
          margin-left:8px;
          padding:0;
          display:flex;
          align-items:center;
          justify-content:center;
          position:relative;
          z-index:9999;
          pointer-events:auto;
          touch-action:manipulation;
          -webkit-tap-highlight-color:transparent;
        "
      >
        📊
      </button>

      <!-- SETTINGS -->
      <button
        id="settings-button"
        type="button"
        aria-label="Settings"
        title="Settings"
        style="
          background:white;
          border:1px solid #D1D1D6;
          width:44px;
          height:44px;
          min-width:44px;
          border-radius:50%;
          font-size:21px;
          cursor:pointer;
          margin-left:8px;
          padding:0;
          display:flex;
          align-items:center;
          justify-content:center;
          position:relative;
          z-index:9999;
          pointer-events:auto;
          touch-action:manipulation;
          -webkit-tap-highlight-color:transparent;
        "
      >
        ⚙️
      </button>

      <!-- ADD HABIT -->
      <button
        id="add-habit-button"
        type="button"
        aria-label="Add Habit"
        title="Add Habit"
        style="
          background:#3B82F6;
          color:white;
          border:none;
          width:44px;
          height:44px;
          min-width:44px;
          border-radius:50%;
          font-size:30px;
          line-height:44px;
          font-weight:400;
          cursor:pointer;
          margin-left:8px;
          padding:0;
          display:flex;
          align-items:center;
          justify-content:center;
          position:relative;
          z-index:9999;
          pointer-events:auto;
          touch-action:manipulation;
          -webkit-tap-highlight-color:transparent;
        "
      >
        +
      </button>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="content">

      <!-- DASHBOARD -->

      <section
        id="dashboard"
        class="dashboard"
      >

        <div class="stats-card">

          <div class="stat">

            <span id="overall-percent">
              0%
            </span>

            <small>
              Monthly
            </small>

          </div>


          <div class="stat">

            <span id="total-completions">
              0
            </span>

            <small>
              Completions
            </small>

          </div>


          <div class="stat">

            <span id="best-streak">
              0 🔥
            </span>

            <small>
              Best Streak
            </small>

          </div>

        </div>


        <div class="section-title">

          <h2>
            Habit Progress
          </h2>

        </div>


        <div id="habit-progress"></div>

      </section>


      <!-- MONTHLY GRID -->

      <div class="grid-scroll-wrapper">

        <div
          id="grid"
          class="habit-grid"
        ></div>

      </div>

    </main>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="js/dateHelpers.js"></script>

  <script src="js/models.js"></script>

  <script src="js/storage.js"></script>

  <script src="js/grid.js?v=4"></script>

  <script src="js/app.js?v=10"></script>

</body>
</html>
