<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="prev-month" class="month-nav">‹</button>
      <h1 id="month-title">September 2026</h1>
      <button id="next-month" class="month-nav">›</button>
    </header>

    <main class="content">

  <!-- Dashboard -->
  <section id="dashboard" class="dashboard">

    <div class="stats-card">
      <div class="stat">
        <span id="overall-percent">0%</span>
        <small>Monthly</small>
      </div>

      <div class="stat">
        <span id="total-completions">0</span>
        <small>Completions</small>
      </div>

      <div class="stat">
        <span id="best-streak">0 🔥</span>
        <small>Best Streak</small>
      </div>
    </div>

    <div class="section-title">
      <h2>Habit Progress</h2>
    </div>

    <div id="habit-progress"></div>

  </section>

  <!-- Monthly Grid -->
  <div class="grid-scroll-wrapper">
    <div id="grid" class="habit-grid"></div>
  </div>

</main>
  </div>

  <script src="js/dateHelpers.js"></script>
  <script src="js/models.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/grid.js?v=3"></script>
  <script src="js/app.js"></script>
</body>
</html>
