<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />

  <title>Habit Tracker</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div id="app">

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

      <!-- Previous month -->
      <button
        id="prev-month"
        class="month-nav"
        type="button"
        aria-label="Previous month"
      >
        ‹
      </button>


      <!-- Month title -->
      <h1 id="month-title">
        September 2026
      </h1>


      <!-- Next month -->
      <button
        id="next-month"
        class="month-nav"
        type="button"
        aria-label="Next month"
      >
        ›
      </button>


      <!-- =========================
           TOP RIGHT ACTIONS
      ========================== -->

      <div
        id="topbar-actions"
        style="
          display:flex;
          align-items:center;
          justify-content:flex-end;
          gap:8px;
          margin-left:auto;
          flex-shrink:0;
        "
      >

        <!-- Statistics -->
        <button
          id="stats-button"
          type="button"
          title="Statistics"
          aria-label="Statistics"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            background:white;
            color:#3B82F6;
            border:1px solid #D1D1D6;
            width:38px;
            height:38px;
            min-width:38px;
            border-radius:50%;
            font-size:18px;
            cursor:pointer;
            padding:0;
            box-sizing:border-box;
          "
        >
          📊
        </button>


        <!-- Settings -->
        <button
          id="settings-button"
          type="button"
          title="Settings"
          aria-label="Settings"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            background:white;
            color:#1C1C1E;
            border:1px solid #D1D1D6;
            width:38px;
            height:38px;
            min-width:38px;
            border-radius:50%;
            font-size:18px;
            cursor:pointer;
            padding:0;
            box-sizing:border-box;
          "
        >
          ⚙️
        </button>


        <!-- Add Habit -->
        <button
          id="add-habit-button"
          type="button"
          title="Add Habit"
          aria-label="Add Habit"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            background:#3B82F6;
            color:white;
            border:none;
            width:38px;
            height:38px;
            min-width:38px;
            border-radius:50%;
            font-size:26px;
            line-height:1;
            font-weight:400;
            cursor:pointer;
            padding:0;
            box-sizing:border-box;
          "
        >
          +
        </button>

      </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="content">

      <!-- Dashboard -->
      <section
        id="dashboard"
        class="dashboard"
      >

        <!-- Main statistics -->
        <div class="stats-card">

          <div class="stat">
            <span id="overall-percent">
              0%
            </span>

            <small>
              Monthly
            </small>
          </div>


          <div class="stat">
            <span id="total-completions">
              0
            </span>

            <small>
              Completions
            </small>
          </div>


          <div class="stat">
            <span id="best-streak">
              0 🔥
            </span>

            <small>
              Best Streak
            </small>
          </div>

        </div>


        <!-- Habit progress title -->
        <div class="section-title">
          <h2>
            Habit Progress
          </h2>
        </div>


        <!-- Habit progress cards -->
        <div id="habit-progress"></div>

      </section>


      <!-- Monthly grid -->
      <div class="grid-scroll-wrapper">

        <div
          id="grid"
          class="habit-grid"
        ></div>

      </div>

    </main>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="js/dateHelpers.js"></script>

  <script src="js/models.js"></script>

  <script src="js/storage.js"></script>

  <script src="js/grid.js?v=4"></script>

  <script src="js/app.js?v=4"></script>

</body>

</html>
